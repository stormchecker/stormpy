name: 'Cache 3rdparty source downloads of Storm'
description: >
  Restores and saves cached sources for gmm, Eigen, and googletest (fetched via FetchContent while configuring Storm).
  Avoids redownloading them.
  First call with restore: true, then execute configure step and append this call's cmake-args, then call with save: true.
inputs:
  restore:
    description: "Restore cached 3rdparty source downloads"
    default: false
  save:
    description: "Save 3rdparty source downloads to cache"
    default: false
  stormDir:
    description: "Directory containing the Storm sources (at least resources/3rdparty/CMakeLists.txt)"
    default: "storm"
  depsDir:
    description: "Build directory in which the fetched 3rdparty sources are searched for when saving"
    default: "storm/build"
outputs:
  cmake-args:
    description: >
      -DFETCHCONTENT_SOURCE_DIR_<NAME> arguments for every cache hit.
    value: ${{ steps.cmake-args.outputs.cmake-args }}

runs:
  using: "composite"
  steps:
    - name: Determine 3rdparty dependency versions
      if: inputs.restore == 'true' || inputs.save == 'true'
      run: |
        THIRDPARTY_CMAKE="${{ inputs.stormDir }}/resources/3rdparty/CMakeLists.txt"
        GMM_VERSION=$(sed -n 's/^ *set(GMM_VERSION "\(.*\)")$/\1/p' "${THIRDPARTY_CMAKE}")
        EIGEN_TAG=$(sed -n 's/^ *set(STORM_EIGEN_GIT_TAG "\(.*\)")$/\1/p' "${THIRDPARTY_CMAKE}")
        GTEST_VERSION=$(sed -n 's/^ *set(GTEST_VERSION "\(.*\)")$/\1/p' "${THIRDPARTY_CMAKE}")
        echo "GMM_VERSION=$GMM_VERSION" >> "$GITHUB_ENV"
        echo "EIGEN_TAG=$EIGEN_TAG" >> "$GITHUB_ENV"
        echo "GTEST_VERSION=$GTEST_VERSION" >> "$GITHUB_ENV"
        # Relative path so the cache version is identical on all runners.
        echo "STORM_3RDPARTY_CACHE_DIR=.ci-3rdparty-cache" >> "$GITHUB_ENV"
        echo "STORM_3RDPARTY_CACHE_DIR_ABS=${GITHUB_WORKSPACE}/.ci-3rdparty-cache" >> "$GITHUB_ENV"
      shell: bash
    - name: Restore gmm source cache
      id: gmm-cache-restore
      if: inputs.restore == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/gmm
        key: 3rdparty-gmm-${{ env.GMM_VERSION }}
    - name: Restore Eigen source cache
      id: eigen-cache-restore
      if: inputs.restore == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/StormEigen
        key: 3rdparty-eigen-${{ env.EIGEN_TAG }}
    - name: Restore googletest source cache
      id: googletest-cache-restore
      if: inputs.restore == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/googletest
        key: 3rdparty-googletest-${{ env.GTEST_VERSION }}
    - name: Compute FetchContent cache-hit CMake args
      id: cmake-args
      if: inputs.restore == 'true'
      run: |
        ARGS=""
        if [ "${{ steps.gmm-cache-restore.outputs.cache-hit }}" = "true" ]; then
          ARGS="$ARGS -DFETCHCONTENT_SOURCE_DIR_GMM=${{ env.STORM_3RDPARTY_CACHE_DIR_ABS }}/gmm"
        fi
        if [ "${{ steps.eigen-cache-restore.outputs.cache-hit }}" = "true" ]; then
          ARGS="$ARGS -DFETCHCONTENT_SOURCE_DIR_EIGEN=${{ env.STORM_3RDPARTY_CACHE_DIR_ABS }}/StormEigen"
        fi
        if [ "${{ steps.googletest-cache-restore.outputs.cache-hit }}" = "true" ]; then
          ARGS="$ARGS -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ env.STORM_3RDPARTY_CACHE_DIR_ABS }}/googletest"
        fi
        echo "cmake-args=$ARGS" >> "$GITHUB_OUTPUT"
        # Persisted via $GITHUB_ENV (not just as step outputs) so the later save: true invocation can reuse it.
        echo "GMM_CACHE_HIT=${{ steps.gmm-cache-restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "EIGEN_CACHE_HIT=${{ steps.eigen-cache-restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "GOOGLETEST_CACHE_HIT=${{ steps.googletest-cache-restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
      shell: bash

    - name: Seed 3rdparty cache from fresh downloads
      if: inputs.save == 'true'
      env:
        DEPS_DIR: ${{ inputs.depsDir }}
      # The location of the fetched sources depends on whether Storm is built directly or as subproject of stormpy.
      # Therefore, the sources are searched for within the build directory.
      run: |
        seed() {
          # Arguments: cache hit, found source directory, name in cache
          if [ "$1" != "true" ] && [ -n "$2" ] && [ -d "$2" ]; then
            mkdir -p "${STORM_3RDPARTY_CACHE_DIR_ABS}"
            cp -a "$2" "${STORM_3RDPARTY_CACHE_DIR_ABS}/$3"
          fi
        }
        seed "${GMM_CACHE_HIT}" "$(find "${DEPS_DIR}" -type d -path '*/_deps/gmm-src' -print -quit)" gmm
        seed "${EIGEN_CACHE_HIT}" "$(find "${DEPS_DIR}" -type d -path '*/StormEigen/StormEigen' -print -quit)" StormEigen
        seed "${GOOGLETEST_CACHE_HIT}" "$(find "${DEPS_DIR}" -type d -path '*/_deps/googletest-src' -print -quit)" googletest
        # Only save if the directory actually exists (the dependency could be disabled).
        echo "GMM_DIR_EXISTS=$([ -d "${STORM_3RDPARTY_CACHE_DIR_ABS}/gmm" ] && echo true || echo false)" >> "$GITHUB_ENV"
        echo "EIGEN_DIR_EXISTS=$([ -d "${STORM_3RDPARTY_CACHE_DIR_ABS}/StormEigen" ] && echo true || echo false)" >> "$GITHUB_ENV"
        echo "GOOGLETEST_DIR_EXISTS=$([ -d "${STORM_3RDPARTY_CACHE_DIR_ABS}/googletest" ] && echo true || echo false)" >> "$GITHUB_ENV"
      shell: bash
    - name: Save gmm source cache
      if: inputs.save == 'true' && env.GMM_CACHE_HIT != 'true' && env.GMM_DIR_EXISTS == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/gmm
        key: 3rdparty-gmm-${{ env.GMM_VERSION }}
    - name: Save Eigen source cache
      if: inputs.save == 'true' && env.EIGEN_CACHE_HIT != 'true' && env.EIGEN_DIR_EXISTS == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/StormEigen
        key: 3rdparty-eigen-${{ env.EIGEN_TAG }}
    - name: Save googletest source cache
      if: inputs.save == 'true' && env.GOOGLETEST_CACHE_HIT != 'true' && env.GOOGLETEST_DIR_EXISTS == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.STORM_3RDPARTY_CACHE_DIR }}/googletest
        key: 3rdparty-googletest-${{ env.GTEST_VERSION }}
