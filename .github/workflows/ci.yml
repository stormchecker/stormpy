name: CI
# Build stormpy and perform checks (check configuration, run tests, check documentation)

# on every pull request commit: run "quick" configs
# for every PR when labeled "ready for review", on every master push: run "normal" configs
# for every PR when labeled "test wheels": only build and test the wheels (once, not on later pushes)
# other labels are ignored
# every week: run "extensive" configs (not fail-fast, including deploy)
# on a manual run: run the configs of the selected mode
# Configurations are defined in ci-configs.json.
# This CI then calls the tests in build-test-action and test-deploy with the given configurations.
# Cache is restored everywhere (ccache not for extensive) but only saved on master pushes.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  schedule:
    - cron: '0 10 * * 3'  # Every Wednesday at 10:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Which configs to run"
        type: choice
        options: [quick, normal, extensive]
        default: normal

# On PRs a newer run cancels the running one.
# On master pushes each run is its own group (via run_id) so CI is never canceled.
# Adding other labels than "ready for review" (e.g. "test wheels") also uses its own group so it does not cancel the running CI.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ready for review') && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Load configurations and filter according to mode (quick/normal/extensive)
  prepare:
    # Skip if a label other than "ready for review" was added (all other jobs depend on prepare)
    if: github.event.action != 'labeled' || github.event.label.name == 'ready for review'
    uses: ./.github/workflows/ci-prepare-configs.yml
    with:
      mode: ${{ github.event_name == 'schedule' && 'extensive'
                || github.event_name == 'workflow_dispatch' && inputs.mode
                || (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready for review')) && 'quick'
                || 'normal' }}

  linuxTests:
    needs: prepare
    # Skip if no configuration is selected for this mode
    if: needs.prepare.outputs.linuxTests != '[]'
    name: ${{ matrix.config.name }} (${{ matrix.config.buildType }})
    runs-on: ubuntu-latest
    container: ${{ matrix.config.baseImg }}
    strategy:
      # Extensive runs all configs to see all failures
      fail-fast: ${{ needs.prepare.outputs.mode != 'extensive' }}
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.linuxTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install packages
        # Each Linux config installs its dependencies (incl. jq and Python) via "setup"
        run: ${{ matrix.config.setup }}
      - name: Build and test stormpy
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ toJson(matrix.config) }}
          # ccache is only used for configs with "cache" set
          # and only saved on pushes to "master"
          restore_cache: ${{ matrix.config.cache }}
          save_cache: ${{ matrix.config.cache && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # 3rdparty sources are only needed when Storm is compiled
          restore_3rdparty_cache: ${{ matrix.config.stormSource != 'system' }}
          save_3rdparty_cache: ${{ matrix.config.stormSource != 'system' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  macTests:
    needs: prepare
    # Skip if no configuration is selected for this mode
    if: needs.prepare.outputs.macTests != '[]'
    name: ${{ matrix.config.name }} (${{ matrix.config.buildType }})
    runs-on: ${{ matrix.config.distro }}
    strategy:
      # Extensive runs all configs to see all failures
      fail-fast: ${{ needs.prepare.outputs.mode != 'extensive' }}
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.macTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Install dependencies
        # cmake, gmp and python3 are already installed
        env:
          USE_CCACHE: ${{ matrix.config.cache }}
        run: |
          brew update
          PACKAGES=(automake boost cln ginac glpk highs hwloc libarchive xerces-c z3)
          if [ "$USE_CCACHE" = "true" ]; then
            PACKAGES+=(ccache)
          fi
          brew install "${PACKAGES[@]}"
      - name: Build and test stormpy
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ toJson(matrix.config) }}
          # ccache is only used for configs with "cache" set
          # and only saved on pushes to "master"
          restore_cache: ${{ matrix.config.cache }}
          save_cache: ${{ matrix.config.cache && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # 3rdparty sources are only needed when Storm is compiled
          restore_3rdparty_cache: ${{ matrix.config.stormSource != 'system' }}
          save_3rdparty_cache: ${{ matrix.config.stormSource != 'system' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  # Need to split deploy into two jobs
  # Otherwise the name is not correctly displayed when the job is skipped.
  # Deploy on master pushes and in extensive mode.
  deploy-debug:
    name: Deploy (Debug)
    needs: prepare
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || needs.prepare.outputs.mode == 'extensive'
    permissions:
      # Needed for documentation deployment
      contents: write
    uses: ./.github/workflows/test-deploy.yml
    with:
      nr_jobs: "4"
      buildType: "Debug"
      dockerTag: "ci-debug"
      stormBase: "movesrwth/storm:ci-debug"
    secrets: inherit

  deploy-release:
    name: Deploy (Release)
    needs: prepare
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || needs.prepare.outputs.mode == 'extensive'
    permissions:
      # Needed for documentation deployment
      contents: write
    uses: ./.github/workflows/test-deploy.yml
    with:
      nr_jobs: "4"
      buildType: "Release"
      dockerTag: "ci"
      stormBase: "movesrwth/storm:ci"
      deployDocs: true
    secrets: inherit

  # Build and test wheels once when the label "test wheels" is added to a PR
  wheels:
    name: Wheels
    if: github.event.action == 'labeled' && github.event.label.name == 'test wheels'
    uses: ./.github/workflows/create_wheel.yml
    with:
      storm_version: master
      # Only build for the latest Python versions
      full_build: false
      build_type: Release

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    needs: [linuxTests, macTests, deploy-debug, deploy-release]
    if: github.repository_owner == 'stormchecker' && (github.event_name == 'push' || github.event_name == 'schedule') && always()
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.STORM_CI_MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.STORM_CI_MAIL_USERNAME }}
          password: ${{ secrets.STORM_CI_MAIL_PASSWORD }}
          subject: "[You broke it] ${{ github.event_name == 'schedule' && 'CI Weekly' || 'CI' }} failed for ${{ github.repository }} on master"
          body:
            "CI job of ${{ github.repository }} has failed for commit ${{ github.sha }}.\n\
            The error type is: ${{ env.WORKFLOW_CONCLUSION }}.\n\n\
            For more information, see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: ${{ secrets.STORM_CI_MAIL_RECIPIENTS }}
          from: Github Actions <you-broke-it@stormchecker.org>
        if: env.WORKFLOW_CONCLUSION != 'success'
